# Second mypy pass: shared/ and nx_worker/ must type-check against Python 3.10,
# the version bundled with NX (HANDOFF.md section 7).
[mypy]
strict = True
python_version = 3.10
files = shared, nx_worker
mypy_path = shared:.
explicit_package_bases = True

[mypy-NXOpen.*]
ignore_missing_imports = True
