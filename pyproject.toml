[project]
name = "drawgen"
version = "0.0.1"
description = "AI drawing harness: NX-first drawing generation, PCBA MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.11,<3"]

[project.scripts]
drawgen = "drawgen.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.13",
    "jsonschema>=4.23",
    "types-jsonschema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drawgen", "shared/drawgen_shared"]

# shared/ and nx_worker/ carry their own ruff.toml with target-version py310.
[tool.ruff]
target-version = "py311"
line-length = 100
# Markdown is prose and specification: never reformat code blocks in it.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PIE", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "shared", "nx_worker", "tests"]
mypy_path = ["src", "shared", "."]
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["NXOpen", "NXOpen.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "shared", "src"]
addopts = "-ra"

[tool.coverage.run]
source = ["src/drawgen", "shared/drawgen_shared"]
